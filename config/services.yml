services:
    phpbbmodders.newspage.controller:
        class: phpbbmodders\newspage\controller\main
        arguments:
            - "@config"
            - "@dispatcher"
            - "@template"
            - "@controller.helper"
            - "@phpbbmodders.newspage"
            - "%core.root_path%"
            - "%core.php_ext%"

    phpbbmodders.newspage.controller.settings:
        class: phpbbmodders\newspage\controller\settings
        arguments:
            - "@auth"
            - "@config"
            - "@request"

    phpbbmodders.newspage.helper:
        class: phpbbmodders\newspage\helper
        arguments:
            - "@controller.helper"
            - "@config"

    phpbbmodders.newspage:
        class: phpbbmodders\newspage\newspage
        arguments:
            - "@auth"
            - "@cache"
            - "@config"
            - "@dbal.conn"
            - "@profilefields.manager"
            - "@template"
            - "@user"
            - "@content.visibility"
            - "@controller.helper"
            - "@phpbbmodders.newspage.helper"
            - "@pagination"
            - "%core.root_path%"
            - "%core.php_ext%"
        calls:
            # phpBB 4.0's avatar helper; phpBB 3.3 has none, so it gets null
            - [set_avatar_helper, ['@?avatar.helper']]

    phpbbmodders.newspage.menu_link_listener:
        class: phpbbmodders\newspage\event\menu_link_listener
        arguments:
            - "@phpbbmodders.newspage.helper"
            - "@template"
            - "@config"
        tags:
            - { name: event.listener }

    phpbbmodders.newspage.viewonline_listener:
        class: phpbbmodders\newspage\event\viewonline_listener
        arguments:
            - "@phpbbmodders.newspage.helper"
            - "@user"
            - "@auth"
            - "%core.php_ext%"
        tags:
            - { name: event.listener }
