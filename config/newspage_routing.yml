phpbbmodders_newspage_page_controller:
    path: /page/{page}
    defaults: { _controller: phpbbmodders.newspage.controller:newspage, forum_id: 0, year: 0, month: 0 }
    requirements:
        page:      \d+

phpbbmodders_newspage_archive_controller:
    path: /archive/{year}/{month}
    defaults: { _controller: phpbbmodders.newspage.controller:newspage, forum_id: 0, page: 1 }
    requirements:
        year:      \d+
        month:     \d+

phpbbmodders_newspage_archive_page_controller:
    path: /archive/{year}/{month}/page/{page}
    defaults: { _controller: phpbbmodders.newspage.controller:newspage, forum_id: 0 }
    requirements:
        year:      \d+
        month:     \d+
        page:      \d+

phpbbmodders_newspage_category_controller:
    path: /category/{forum_id}
    defaults: { _controller: phpbbmodders.newspage.controller:newspage, year: 0, month: 0, page: 1 }
    requirements:
        forum_id:  \d+

phpbbmodders_newspage_category_page_controller:
    path: /category/{forum_id}/page/{page}
    defaults: { _controller: phpbbmodders.newspage.controller:newspage, year: 0, month: 0 }
    requirements:
        forum_id:  \d+
        page:      \d+

phpbbmodders_newspage_category_archive_controller:
    path: /category/{forum_id}/archive/{year}/{month}
    defaults: { _controller: phpbbmodders.newspage.controller:newspage, page: 1 }
    requirements:
        forum_id:  \d+
        year:      \d+
        month:     \d+

phpbbmodders_newspage_category_archive_page_controller:
    path: /category/{forum_id}/archive/{year}/{month}/page/{page}
    defaults: { _controller: phpbbmodders.newspage.controller:newspage }
    requirements:
        forum_id:  \d+
        year:      \d+
        month:     \d+
        page:      \d+

phpbbmodders_newspage_singlenews_controller:
    path: /{topic_id}
    defaults: { _controller: phpbbmodders.newspage.controller:single_news }
    requirements:
        topic_id:  \d+
