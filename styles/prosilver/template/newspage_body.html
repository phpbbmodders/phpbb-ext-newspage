<!-- INCLUDE overall_header.html -->

<!-- EVENT nickvergessen_newspage_before -->

<h2><!-- IF NEWS_ONLY -->{NEWS_TITLE}<!-- ELSE -->{L_NEWS}<!-- ENDIF --></h2>
<!-- EVENT nickvergessen_newspage_title_after -->

<!-- IF .archive_block or .cat_block or .pagination or TOTAL_NEWS -->
<br />
<!-- EVENT nickvergessen_newspage_filters_before -->
<div class="action-bar newspage-filters">
	<!-- INCLUDE newspage_categories_dropdown.html -->
	<!-- INCLUDE newspage_archives_dropdown.html -->

	<!-- IF (PAGE_NUMBER and PAGINATION) or TOTAL_NEWS -->
	<div class="pagination">
		{TOTAL_NEWS} &bull;
		<!-- IF .pagination -->
			<!-- INCLUDE pagination.html -->
		<!-- ELSE -->
			{PAGE_NUMBER}
		<!-- ENDIF -->
	</div>
	<!-- ENDIF -->
</div>
<!-- IF NEWS_FILTER_CATEGORY or NEWS_FILTER_ARCHIVE_YEAR -->
<p class="newspage-active-filters">
	<span>{L_NEWS_FILTER_SHOWING}{L_COLON}</span>
	<!-- IF NEWS_FILTER_CATEGORY -->
	<a href="{U_REMOVE_CATEGORY_FILTER}" class="newspage-chip" title="{L_NEWS_FILTER_REMOVE}">{NEWS_FILTER_CATEGORY} <i class="icon fa-times fas fa-fw" aria-hidden="true"></i><span class="sr-only">{L_NEWS_FILTER_REMOVE}</span></a>
	<!-- ENDIF -->
	<!-- IF NEWS_FILTER_ARCHIVE_YEAR -->
	<a href="{U_REMOVE_ARCHIVE_FILTER}" class="newspage-chip" title="{L_NEWS_FILTER_REMOVE}">{NEWS_FILTER_ARCHIVE_MONTH} {NEWS_FILTER_ARCHIVE_YEAR} <i class="icon fa-times fas fa-fw" aria-hidden="true"></i><span class="sr-only">{L_NEWS_FILTER_REMOVE}</span></a>
	<!-- ENDIF -->
	<!-- IF NEWS_FILTER_CATEGORY and NEWS_FILTER_ARCHIVE_YEAR -->
	<a href="{U_NEWSPAGE}" class="newspage-clear">{L_NEWS_FILTER_CLEAR}</a>
	<!-- ENDIF -->
</p>
<!-- ENDIF -->
<!-- EVENT nickvergessen_newspage_filters_after -->
<!-- ENDIF -->

<!-- IF .postrow -->
	<!-- INCLUDE viewtopic_postrow.html -->
<!-- ELSE -->
<div class="panel">
	<div class="inner">
		<strong>{L_NO_NEWS}</strong>
	</div>
</div>
<!-- ENDIF -->

<!-- IF .pagination -->
<hr class="divider" />
<div class="action-bar">
	<div class="pagination">
		{TOTAL_NEWS} &bull; <!-- INCLUDE pagination.html -->
	</div>
</div>
<br />
<!-- ENDIF -->

<!-- EVENT nickvergessen_newspage_after -->

<!-- INCLUDE overall_footer.html -->
