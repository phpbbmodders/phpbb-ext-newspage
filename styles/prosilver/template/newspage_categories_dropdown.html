<!-- IF .cat_block -->
<div class="dropdown-container dropdown-button-control newspage-dropdown">
	<span title="{L_NEWS_FILTER_BY_CATEGORY}" class="button dropdown-trigger dropdown-select newspage-filter<!-- IF NEWS_FILTER_CATEGORY --> newspage-filter-active<!-- ENDIF -->">
		<span><!-- IF NEWS_FILTER_CATEGORY -->{NEWS_FILTER_CATEGORY}<!-- ELSE -->{L_NEWS_FILTER_CATEGORY}<!-- ENDIF --></span>
		<i class="icon fa-caret-down fas fa-fw" aria-hidden="true"></i>
	</span>
	<div class="dropdown hidden">
		<div class="pointer"><div class="pointer-inner"></div></div>
		<ul class="dropdown-contents">
			<li>
				<strong>{L_NEWS_CAT}</strong>
				<!-- IF U_REMOVE_CATEGORY_FILTER -->
					<a href="{U_REMOVE_CATEGORY_FILTER}" class="newspage-remove">{L_NEWS_FILTER_REMOVE}</a>
				<!-- ENDIF -->
			</li>
			<!-- BEGIN cat_block -->
			<li>
				<a href="{cat_block.U_NEWS_CAT}" class="newspage-option">
					<!-- IF cat_block.S_SELECTED --><strong><!-- ENDIF -->
					{cat_block.NEWS_CAT}
					<!-- IF cat_block.S_SELECTED --></strong><!-- ENDIF -->
				</a>
				<span class="newspage-count">{cat_block.NEWS_COUNT}</span>
				<!-- IF cat_block.U_POST_NEWS -->
					<a href="{cat_block.U_POST_NEWS}" class="newspage-add" title="{L_NEWS_ADD_NEW_TITLE}">{L_NEWS_ADD_NEW}</a>
				<!-- ENDIF -->
			</li>
			<!-- END cat_block -->
		</ul>
	</div>
</div>
<!-- ENDIF -->
