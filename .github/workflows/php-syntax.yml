name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check tracked PHP files
        shell: bash
        run: |
          set -euo pipefail
          php --version
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php')
