name: Bug report
description: Report a reproducible problem with NV Newspage.
labels: ["bug"]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the extension revision, phpBB version, PHP version, and database backend.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the problem on a disposable board.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant errors
      description: Remove credentials and private board data before posting logs.
